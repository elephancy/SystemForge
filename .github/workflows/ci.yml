name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:performance
      - run: pnpm build
      - run: pnpm --filter @systemforge/web test:sites
      - run: pnpm audit --audit-level=high

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          install -d "$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          actual_sha=$(sha256sum "$RUNNER_TEMP/actionlint.tar.gz")
          test "${actual_sha%% *}" = "$ACTIONLINT_SHA256"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yml
      - run: sh -n scripts/*.sh
      - run: sh scripts/deploy_workflow_contract.test.sh
      - run: node scripts/web_route_contract.test.mjs
      - run: node scripts/service_worker_contract.test.mjs
      - run: node scripts/overload_smoke_contract.test.mjs
      - run: node scripts/production_smoke_contract.test.mjs
      - run: sh scripts/edge_contract.test.sh
      - run: sh scripts/offsite_backup.test.sh
      - run: sh scripts/provision_offsite_backup.test.sh
      - run: sh scripts/release_backup_gate.test.sh
      - run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml config --quiet

  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutations
      - run: pnpm test:stability

  browser:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/browser/
          if-no-files-found: error
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    needs: [quality, repository, hardening, browser]
    env:
      POSTGRES_PASSWORD: ci-only-url-safe-password
      SYSTEMFORGE_IMAGE_TAG: ${{ github.sha }}
      VITE_CANONICAL_RELEASE_ENABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker network create web
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: deploy/docker-compose.prod.yml
          targets: systemforge-api,systemforge-web,systemforge-worker
          load: true
          set: |
            systemforge-api.cache-from=type=gha,scope=systemforge-systemforge-api
            systemforge-api.cache-to=type=gha,mode=max,scope=systemforge-systemforge-api
            systemforge-web.cache-from=type=gha,scope=systemforge-systemforge-web
            systemforge-web.cache-to=type=gha,mode=max,scope=systemforge-systemforge-web
            systemforge-worker.cache-from=type=gha,scope=systemforge-systemforge-worker
            systemforge-worker.cache-to=type=gha,mode=max,scope=systemforge-systemforge-worker
            *.context=.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: systemforge-api:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: systemforge-web:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: systemforge-worker:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Package the scanned release images
        run: |
          mkdir -p "$RUNNER_TEMP/systemforge-release"
          docker save --output "$RUNNER_TEMP/systemforge-release/systemforge-images.tar" \
            "systemforge-api:$SYSTEMFORGE_IMAGE_TAG" \
            "systemforge-web:$SYSTEMFORGE_IMAGE_TAG" \
            "systemforge-worker:$SYSTEMFORGE_IMAGE_TAG"
          gzip -1 "$RUNNER_TEMP/systemforge-release/systemforge-images.tar"
          cd "$RUNNER_TEMP/systemforge-release"
          sha256sum systemforge-images.tar.gz > systemforge-images.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: systemforge-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/systemforge-release/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  integration:
    runs-on: ubuntu-latest
    needs: [containers]
    env:
      POSTGRES_PASSWORD: ci-only-url-safe-password
      SYSTEMFORGE_IMAGE_TAG: ${{ github.sha }}
      VITE_CANONICAL_RELEASE_ENABLED: "true"
      MAX_QUEUED_RUNS: "2"
      MAX_STORED_RUNS: "2"
      MAX_CANONICAL_RESULT_BYTES: "100000"
      WORKER_MAINTENANCE_MS: 1000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: systemforge-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/systemforge-release
      - name: Verify and load the scanned release images
        run: |
          cd "$RUNNER_TEMP/systemforge-release"
          sha256sum --check systemforge-images.tar.gz.sha256
          docker load --input systemforge-images.tar.gz
          docker image inspect "systemforge-api:$SYSTEMFORGE_IMAGE_TAG"
          docker image inspect "systemforge-web:$SYSTEMFORGE_IMAGE_TAG"
          docker image inspect "systemforge-worker:$SYSTEMFORGE_IMAGE_TAG"
      - run: docker network create web
      - run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180
      - run: >-
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml
          exec -T
          -e SMOKE_API_ORIGIN=http://127.0.0.1:8080
          -e SMOKE_WEB_ORIGIN=http://systemforge-web:8080
          -e SMOKE_VERIFY_STORAGE_CAP=true
          -e SMOKE_VERIFY_RESULT_CAP=true
          systemforge-api node /app/apps/api/production_smoke.mjs
      - name: Prove overload containment and local-shell availability
        run: >-
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml
          exec -T
          -e OVERLOAD_API_ORIGIN=http://127.0.0.1:8080
          -e OVERLOAD_WEB_ORIGIN=http://systemforge-web:8080
          systemforge-api node /app/apps/api/overload_smoke.mjs
      - name: Verify a PostgreSQL backup and disposable restore drill
        run: |
          export SYSTEMFORGE_APP_DIR="$PWD"
          export SYSTEMFORGE_BACKUP_DIR="$RUNNER_TEMP/systemforge-backups"
          export SYSTEMFORGE_ENV_FILE="$PWD/deploy/.env.example"
          sh scripts/backup_postgres.sh
          sh scripts/verify_backup_restore.sh
      - if: always()
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml logs --no-color
      - if: always()
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml down -v
