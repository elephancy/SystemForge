name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/lighthouse.yml"
      - ".github/lighthouseci.cjs"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/lighthouse.yml"
      - ".github/lighthouseci.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
      - name: Build local production website
        run: pnpm --filter @systemforge/web build
      - name: Audit local production website
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CHROME_PATH"
          test -f apps/web/dist/client/index.html
          npx --yes --package=@lhci/cli@0.15.1 lhci autorun --config=./.github/lighthouseci.cjs
      - name: Preserve Lighthouse reports in the repository artifact store
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lighthouse/
          retention-days: 1
          if-no-files-found: ignore
