name: SystemForge Production Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemforge-production-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check browser shell and canonical readiness
        run: |
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 15 https://systemforge.elfeel.me/ | grep -q SystemForge
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 15 https://systemforge.elfeel.me/api/health/ready | grep -q '"status":"ready"'
