worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types application/javascript application/json text/css text/plain image/svg+xml;

  # Keep route-specific cache policy at one header level. Location add_header
  # directives would otherwise reset inherited security headers.
  map $status $cacheable_response {
    default 0;
    200 1; 201 1; 204 1; 206 1;
    301 1; 302 1; 303 1; 304 1; 307 1; 308 1;
  }

  map "$cacheable_response:$uri" $route_cache_control {
    default "public, max-age=0, must-revalidate, no-transform";
    ~^1:/assets/ "public, max-age=31536000, immutable";
    ~^0:/assets/ "";
    "1:/manifest.webmanifest" "public, max-age=3600";
    "0:/manifest.webmanifest" "";
    "1:/asset-manifest.json" "no-cache";
    "0:/asset-manifest.json" "";
    "1:/asset-precache.json" "no-cache";
    "0:/asset-precache.json" "";
    ~^[01]:/offline\.html$ "no-store, no-transform";
    ~^[01]:/(health|robots\.txt|sitemap\.xml)$ "";
  }

  map $uri $route_cdn_cache_control {
    default "public, max-age=300, stale-while-revalidate=60, stale-if-error=86400";
    ~^/assets/ "";
    /manifest.webmanifest "";
    /asset-manifest.json "";
    /asset-precache.json "";
    /offline.html "";
    /health "";
    /robots.txt "";
    /sitemap.xml "";
  }

  # request_uri survives the internal SPA redirect to /index.html.
  map $request_uri $route_robots_tag {
    default "";
    ~^/scenario/[A-Za-z0-9-]+($|[?]) "noindex, follow";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $route_cache_control always;
    add_header Cloudflare-CDN-Cache-Control $route_cdn_cache_control always;
    add_header X-Robots-Tag $route_robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /assets/ {
      try_files $uri =404;
    }

    location = /manifest.webmanifest {
      default_type application/manifest+json;
      try_files $uri =404;
    }

    location = /asset-manifest.json {
      default_type application/json;
      try_files $uri =404;
    }

    location = /asset-precache.json {
      default_type application/json;
      try_files $uri =404;
    }

    location = /robots.txt {
      default_type text/plain;
      try_files $uri =404;
    }

    location = /sitemap.xml {
      default_type application/xml;
      try_files $uri =404;
    }

    location ~ ^/(lab|custom|interview|replay|decisions)$ {
      try_files /index.html =404;
    }

    location ~ ^/scenario/[A-Za-z0-9-]+$ {
      try_files /index.html =404;
    }

    location / {
      error_page 404 =404 /index.html;
      try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /offline.html;
    location = /offline.html {
      internal;
    }
  }
}
